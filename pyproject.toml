[project]
name = "terraform-docs-mcp"
version = "0.1.1"
description = "Offline MCP server for hybrid search over Terraform AWS and Google provider documentation"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]

# Runtime stays deliberately lean: the installed tool never chunks or downloads
# anything, so langchain / huggingface-hub live in the `build` group instead.
dependencies = [
    "mcp>=2.0.0",
    "numpy>=2.1",
    # Imported directly for tool parameter descriptions; also an mcp dependency.
    "pydantic>=2",
    # Needed at query time as well as index time, so it cannot be build-only:
    # every search embeds its query with the same model that built the index.
    "sentence-transformers>=5.0",
    "typer>=0.27.1",
]

[project.scripts]
terraform-docs = "terraform_docs_mcp.cli:main"
terraform-docs-probe = "terraform_docs_mcp.probe:main"

[dependency-groups]
build = [
    "langchain-text-splitters>=1.1.2",
    "huggingface-hub>=0.30",
    "pyyaml>=6",
]
dev = [
    "basedpyright>=1.31",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:terraform_docs_mcp.*"]

[tool.uv.build-backend]
module-name = "terraform_docs_mcp"
module-root = "src"
# Do NOT add `source-exclude` for _data/. Despite being documented as applying
# to source distributions, it also strips matching paths from the *wheel* --
# which silently produced a 31 KB wheel with no index in it. uv_build otherwise
# includes non-.py files under the module directory automatically, and does so
# even though _data/ is gitignored, which is what we want: the index is
# generated by `make index`, never committed, and always shipped.
